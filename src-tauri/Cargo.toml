[package]
name = "kairox-desktop"
version = "0.2.0"
description = "KAIROX endpoint intelligence desktop prototype"
authors = ["KAIROX"]
edition = "2021"

[lib]
name = "kairox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
